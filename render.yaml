services:
  # =========================================================================
  # 1. Backend Web Service (FastAPI + Uvicorn + SQLite/Postgres)
  # =========================================================================
  - type: web
    name: ottv2-backend
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:///./ottv2.db
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "*"
      - key: SANDBOX_TIMEOUT_SEC
        value: 5
      - key: SANDBOX_MEMORY_MB
        value: 128
      - key: STORAGE_PATH
        value: ./storage

  # =========================================================================
  # 2. Frontend Static Site (Vite React + Single Page Application)
  # =========================================================================
  - type: web
    name: ottv2-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ottv2-backend.onrender.com/api
      - key: VITE_WS_BASE_URL
        value: wss://ottv2-backend.onrender.com/ws
