version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./ottv2.db
      - SECRET_KEY=${SECRET_KEY:-changeme_in_production}
      - FRONTEND_URL=http://localhost:5173
      - SANDBOX_TIMEOUT_SEC=5
      - SANDBOX_MEMORY_MB=128
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/ottv2.db:/app/ottv2.db
      - ./rules.json:/app/rules.json
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_storage:

